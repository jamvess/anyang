# AI gateway configuration (ai-orchestration §2.10). Change models here, not in code.
# Model IDs come from the PoC reports (specs/poc/reports/); a tier not measured yet keeps its TODO.
# "vertex:" runs on Vertex AI when GOOGLE_CLOUD_PROJECT is set (specs/features/ai/gemini-vertex.md;
# AI-07: no free tier for real users). AI_MODEL_OVERRIDE=gemini:<model> still uses the Gemini API key.

version: "1.21"                        # a string: unquoted, YAML reads 1.10 as the float 1.1

tiers:
  small:  {primary: "vertex:gemini-3.5-flash",   fallback: "anthropic:TODO-claude-haiku"}  # P3a on Vertex (31 Oct): A4 43/43, A7 34/43 and 30/43 · flash-lite broke JSON with LaTeX (unescaped \\sqrt) on 1 of 2 exams (P3.md §7)
  mid:    {primary: "vertex:gemini-3.5-flash",   fallback: "anthropic:TODO-claude-haiku"}  # P3: A5 on 4/4 sheets, schema ok · flash-lite too coarse (P3.md)
  main:   {primary: "vertex:gemini-3.5-flash",   fallback: "anthropic:TODO-claude-sonnet"} # P3a on Vertex (31 Oct): A6 merge_topics v2 valid on the first try, ★★★ 10/12 (P3.md §7)
  vision: {primary: "vertex:gemini-3.5-flash-lite", fallback: "mathpix"}   # P1: line accuracy 95.2% (P1.md) · P3a: A2b 14 pages in 12-27 s · Mathpix not tested
  embed:  {primary: "vertex:gemini-embedding-2", fallback: null}           # P3b: recall@4 95% at 768 dimensions (P3.md)

purposes:
  # thinking: Gemini 3 thinking level; its tokens count inside max_tokens (PoC P3, 2026-10-19)
  # max_tokens and timeout_s of flow 2.3 raised before the first P3 run (Thai output + thinking) · P3: both free-tier merge_topics answers failed the schema (11,242 and 14,944 output tokens of 16,000), so no valid size yet · vision_extract_pages: 7,943 tokens for 14 pages · re-check both in the P3a re-run on Vertex (S4)
  # flow 2.3
  classify_material:      {tier: small,  temperature: 0.0, max_tokens: 300,  timeout_s: 20, prompt: v1}
  vision_extract:         {tier: vision, temperature: 0.0, max_tokens: 4000, timeout_s: 60, prompt: v1, thinking: low}
  vision_extract_pages:   {tier: vision, temperature: 0.0, max_tokens: 16000, timeout_s: 180, prompt: v1, thinking: low}  # PoC P3: whole scanned file in one call
  split_past_exam:        {tier: small,  temperature: 0.0, max_tokens: 16000, timeout_s: 120, prompt: v1, thinking: low}
  extract_topics_local:   {tier: mid,    temperature: 0.2, max_tokens: 8000, timeout_s: 120, prompt: v2, thinking: low}  # P3a on Vertex: with merge_topics v2, ★★★ 10/12 (v1: 8/12)
  merge_topics:           {tier: main,   temperature: 0.2, max_tokens: 32000, timeout_s: 180, prompt: v2, thinking: medium}  # P3a on Vertex (2026-10-31): v1 merged 51 topics into 17 and 3 of 4 answers hit 16000 (thinking counts inside) · v2 used 19,390-20,018 · [C] 32000, re-check on a bigger course
  map_questions:          {tier: small,  temperature: 0.0, max_tokens: 8000, timeout_s: 120, prompt: v1, thinking: low}
  scope_edit:             {tier: mid,    temperature: 0.3, max_tokens: 800,  timeout_s: 30, prompt: v1}
  # flow 2.2 / 2.4
  route_intent:           {tier: small,  temperature: 0.0, max_tokens: 100,  timeout_s: 8,  prompt: v1}
  extract_answer:         {tier: vision, temperature: 0.0, max_tokens: 1500, timeout_s: 20, prompt: v1}
  normalize_math:         {tier: small,  temperature: 0.0, max_tokens: 500,  timeout_s: 8,  prompt: v1}
  check_answer:           {tier: mid,    temperature: 0.0, max_tokens: 600,  timeout_s: 15, prompt: v2, thinking: low}  # P2 first live run: default thinking timed out at 15 s (2026-10-28)
  generate_problem:       {tier: mid,    temperature: 0.7, max_tokens: 2000, timeout_s: 20, prompt: v2, thinking: low}  # v2 gets previous_problems, the latest of the topic, so the next problem differs (room-problems-db.md §2.3 v2 · PR #133) · a problem of the chosen topic, its expression for SymPy and the answer (room-problems-db.md §2.3 · AM-11) · [C] max_tokens 2000 + low thinking like the other purposes of Gemini 3 (thinking counts in max_tokens) · measure the share SymPy verifies (worklog step 4)
  tutor_reply:            {tier: main,   temperature: 0.6, max_tokens: 2000, timeout_s: 30, prompt: v2, stream: true, thinking: minimal}  # v2 knows the pending problem (demo-room.md §2 C) · P4-lite measured v1 on Vertex (2026-11-01, 50 messages each): low TTFT p95 3.87 s, 435 tokens out; minimal p95 1.20 s, 78 out, 0.039 THB/message (poc/P4-lite/README.md) · [C] max_tokens 2000 kept (minimal max 116 out)
  open_session:           {tier: main,   temperature: 0.6, max_tokens: 2000, timeout_s: 30, prompt: v2, stream: true, thinking: minimal}  # v2 adds `focus`, the chosen topic and its reason (room-problems-db.md §2.2 · TM-02) · greeting from facts when the room opens (demo-room.md §2 F · TM-15) · [C] same as tutor_reply until measured
  typed_answer:           {tier: small,  temperature: 0.0, max_tokens: 800,  timeout_s: 10, prompt: v2, thinking: minimal}  # v2 also reads giving up (demo-room.md §2 K item 6) · is a typed message the answer, and its LaTeX lines (demo-room.md §2 G · stands in for route_intent + normalize_math) · [C] minimal thinking for speed; measure on a golden set
  explain_check:          {tier: main,   temperature: 0.6, max_tokens: 2000, timeout_s: 30, prompt: v3, stream: true, thinking: minimal}  # v3 says what the code's directive says: continue, hint_1, hint_2, reveal, praise_and_show, ask_working (demo-room.md §2 K) · v2 shows the full worked solution every time and asks for working when it is missing (demo-room.md §2 H, I) · the tutor's explanation after a verdict (photo-check-in-room.md §2.2 item 6 · AM-07) · [C] same as tutor_reply until measured: no golden set yet, smoke on Vertex only
  dispute_recheck:       {tier: main,   temperature: 0.0, max_tokens: 1000, timeout_s: 30, prompt: v1}
  update_running_summary: {tier: small,  temperature: 0.2, max_tokens: 400,  timeout_s: 20, prompt: v1}
  session_summary:        {tier: small,  temperature: 0.3, max_tokens: 150,  timeout_s: 15, prompt: v1, thinking: minimal}  # 1-2 lines when the user ends the session (session-end-db.md §2.3 · PM-05) · [C] minimal thinking: Gemini 3 counts thinking in max_tokens
  # flow 2.7 / 2.8
  persona_extract:        {tier: small,  temperature: 0.0, max_tokens: 400,  timeout_s: 15, prompt: v1}
  persona_preview:        {tier: small,  temperature: 0.7, max_tokens: 150,  timeout_s: 15, prompt: v1}
  latex_to_speech:        {tier: small,  temperature: 0.0, max_tokens: 300,  timeout_s: 8,  prompt: v1}

ingestion:                             # files → pages → chunks (specs/features/scope/ingestion.md · ai-orchestration §2.3.3) · values of PoC P3, no change
  min_thai_share: 0.3                  # [C] Thai ÷ (Thai + Latin) letters of a file's text layer; below → scanned, read by vision · P3: scanned exams 0.0, sheets > 0.5 · calibrate on more courses
  render_dpi: 150                      # [C] page images for vision_extract_pages · P3: 14 scanned pages read well at 150
  classify_pages: 3                    # [C] first pages (text layer) sent to classify_material (ai-orchestration §2.3.2 step 2)
  chunk_min_tokens: 400                # ai-orchestration §2.3.3 · P3b
  chunk_max_tokens: 800                # ai-orchestration §2.3.3 · P3b (recall@4 95%)
  chunk_max_pages: 2                   # ai-orchestration §2.3.3
  thai_chars_per_token: 1.7            # [C] P3b: count_tokens of gemini-embedding-2 gave 1.47–1.82 Thai chars per token

embedding:                             # A3 embed (ai-orchestration §2.3.3), tier `embed` · no prompt
  timeout_s: 60                        # [C] one batch request · P3b: 116 chunks in 21.6 s (~1.8 s per batch of 10), so 60 leaves a wide margin · after Alpha: from ai_calls
  batch_size: 1                        # [C] texts per request · Vertex: embedContent of gemini-embedding-2 takes one content per request (live run of ingestion on MTH10101, 13 Nov · specs/features/scope/ingestion.md §2.3) · P3b sent 10 on the Gemini API · 116 chunks ≈ 70 s · raise only with a provider that batches
  dimensions: 768                      # = chunks.embedding vector(768) · P3b: gemini-embedding-2 recall@4 95% at 768 vs 90% at 3072 (specs/poc/reports/P3.md)

gateway:
  retries: 1                           # then fallback provider, then degrade
  retry_backoff_seconds: 1             # [C] wait before a retry when the provider gives no retry delay · after Alpha: pick from ai_calls (success rate of retries by wait)
  max_retry_wait_seconds: 10           # [C] do not retry if the provider asks to wait longer (a chat turn targets TTFT p95 2 s) · after Alpha: from ai_calls
  schema_retries: 1                    # retry once with the validation error appended
  circuit_breaker:                     # [B] Resilience4j defaults
    failure_rate_threshold: 0.5
    minimum_calls: 10
    sliding_window_calls: 100
    open_seconds: 60

guards:
  max_message_chars: 2000
  rate_limit_messages_per_minute: 20
  max_image_mb: 10
  max_audio_seconds: 60
  max_material_mb: 50                  # [B] PDF, PPTX, DOCX (images use max_image_mb) · the file limit of Supabase Free (supabase.com/docs/guides/storage/uploads/file-limits); a bucket cannot go higher · largest real file so far 6.2 MB (evals/topics, one course) · the size of an upload only: a scan fails long before this (api.md v1.13 รอตัดสิน v1.10 ข้อ 2)
  max_persona_text_chars: 20           # [C] name, self_pronoun, call_user reach the prompt · a guess that fits a nickname or a pronoun, no data yet (api.md v1.12)
  max_attachment_name_chars: 255       # [B] display cap for user-visible file names · counted in grapheme clusters, extension kept · never used in Storage paths
  max_exam_prep_title_chars: 100       # [C] exam prep title (POST /exam-preps) · counted in grapheme clusters, so Thai vowels and tone marks do not count · a guess that fits a course name plus "กลางภาค", no data yet · revisit after the first real users (api.md v1.14)
  answer_leak_check: true

targets:                               # checked in PoC P4-lite and monitored in production
  ttft_p95_seconds: 2                  # Nielsen 1 s flow limit + LLM latency; streaming shows progress
  cost_per_session_thb: 5

retention:
  audio_days: 7
  full_prompt_days: 30                 # dev/pilot only; metadata kept afterwards
