<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>อ่านยัง? — Wireframe · เว็บบนคอม</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#EDEFF1;--white:#fff;--soft:#FAFBFC;
  --ink:#14171C;--ink60:#5A6270;--ink35:#9AA2AE;
  --line:#D9DEE4;--line2:#EAEEF1;
  --ac:#3D4EE0;--acs:#E8EAFD;
  --ok:#0E7C5A;--oks:#DDF2EB;
  --wn:#A65E06;--wns:#FBEEDA;
  --bd:#B3261E;--bds:#FBE9E6;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);
  font-family:"IBM Plex Sans Thai",system-ui,sans-serif;line-height:1.65;
  -webkit-font-smoothing:antialiased}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace}
.stage{max-width:1100px;margin:0 auto;padding:34px 28px 70px}
@media(max-width:780px){.stage{padding:20px 14px 50px}}
.kicker{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--ink35);margin:0 0 16px}
.win{border:1px solid var(--line);border-radius:12px;overflow:hidden;
  background:var(--white);box-shadow:0 2px 10px rgba(20,23,28,.06)}
.chrome{display:flex;align-items:center;gap:12px;padding:9px 14px;
  border-bottom:1px solid var(--line2);background:#F4F6F8}
.dots{display:flex;gap:6px}
.dots i{width:9px;height:9px;border-radius:50%;background:#D5DAE0;display:block}
.url{flex:1;background:var(--white);border:1px solid var(--line);border-radius:6px;
  padding:4px 11px;font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--ink35)}
.clock{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--ink35)}
.vp{min-height:600px;display:flex;flex-direction:column}
.vp.fade{animation:fi .22s ease}
@keyframes fi{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

.topbar{display:flex;justify-content:space-between;align-items:center;
  padding:13px 26px;border-bottom:1px solid var(--line2);flex:0 0 auto}
.brand{font-weight:600;font-size:15px}
.app{display:grid;grid-template-columns:196px 1fr;flex:1;min-height:0}
.side{border-right:1px solid var(--line2);padding:16px 13px;background:var(--soft)}
.side .nav{font-size:13px;padding:7px 9px;border-radius:7px;color:var(--ink60);margin-bottom:2px}
.side .nav.on{background:var(--white);color:var(--ink);font-weight:500;box-shadow:0 0 0 1px var(--line)}
.main{padding:26px 34px;min-width:0}
.center{max-width:540px;margin:0 auto}
.wide{max-width:760px;margin:0 auto}

/* ---- ห้องติว · UI น้อยที่สุด ---- */
.room{flex:1;display:flex;flex-direction:column;min-height:0;padding:0 34px 20px}
.roomtop{display:flex;justify-content:space-between;align-items:center;
  max-width:640px;margin:0 auto;width:100%;padding:14px 0 18px;
  font-size:12px;color:var(--ink35)}
.roomtop b{font-weight:500;color:var(--ink60)}
.feed{flex:1;max-width:640px;margin:0 auto;width:100%}
.m{display:flex;gap:12px;margin-bottom:3px}
.m .av{width:30px;height:30px;border-radius:50%;flex:0 0 30px;font-size:11.5px;
  display:flex;align-items:center;justify-content:center;background:var(--acs);color:var(--ac)}
.m .av.b{background:var(--line2);color:var(--ink60)}
.m .av.u{background:var(--ink);color:var(--white)}
.m.cont{margin-top:0}
.m.cont .av{visibility:hidden;height:0;min-height:0}
.m .body{min-width:0;padding-top:1px}
.who{font-size:13px;font-weight:600;line-height:1.5;margin:0 0 1px}
.who span{font-weight:400;font-size:10.5px;color:var(--ink35);margin-left:8px;
  font-family:"IBM Plex Mono",monospace}
.m p{margin:0 0 3px;font-size:14px;line-height:1.7}
.gap{height:13px}
.eq{font-family:"IBM Plex Mono",monospace;font-size:13.5px;
  background:var(--line2);padding:1px 6px;border-radius:4px}
.shot{border:1px solid var(--line);border-radius:10px;padding:14px;margin:4px 0 6px;
  display:inline-block;font-size:12.5px;color:var(--ink35);background:var(--soft)}
.read{border:1px solid var(--line);border-radius:10px;padding:12px 15px;margin:5px 0 6px}
.composer{max-width:640px;margin:14px auto 0;width:100%;display:flex;gap:8px;align-items:center;
  border:1px solid var(--line);border-radius:26px;padding:6px 8px 6px 18px;background:var(--white)}
.composer .ph{flex:1;font-size:13.5px;color:var(--ink35)}
.iconb{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;
  justify-content:center;font-size:14px;border:1px solid var(--line);background:var(--white);flex:0 0 34px}
.iconb.pri{background:var(--ink);color:#fff;border-color:var(--ink)}
.composer .draft{flex:1;font-size:13.5px;color:var(--ink)}
.vnote{max-width:640px;margin:6px auto 0;width:100%;font-size:11.5px;color:var(--ac);padding-left:18px}
.spk{font-size:11px;margin-left:6px;opacity:.6}
.area{border-collapse:collapse;margin:6px 0 8px;font-family:"IBM Plex Mono",monospace;font-size:13px}
.area td{border:1px solid var(--line);padding:6px 14px;text-align:center}
.area td.hd{border:0;color:var(--ink35)}

/* ---- atoms ---- */
.h{font-size:20px;font-weight:600;margin:0 0 6px;line-height:1.3}
.h2{font-size:16px;font-weight:600;margin:0 0 6px}
.sub{font-size:13.5px;color:var(--ink60);margin:0 0 18px}
.lb{font-size:12px;color:var(--ink60);margin:0 0 5px;display:block}
.fld{border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:13.5px;
  color:var(--ink35);margin-bottom:12px;background:var(--white)}
.fld.v{color:var(--ink)}
.fld.sel:after{content:"⌄";float:right;color:var(--ink35)}
.fld.sm{padding:7px 10px;font-size:12.5px;margin-bottom:0}
.btn{border:1px solid var(--line);border-radius:8px;padding:10px 18px;text-align:center;
  font-size:13.5px;font-weight:500;background:var(--white);display:inline-block}
.btn.blk{display:block;margin-bottom:10px}
.btn.pri{background:var(--ink);color:var(--white);border-color:var(--ink)}
.btn.ac{background:var(--ac);color:var(--white);border-color:var(--ac)}
.btn.sm{padding:7px 12px;font-size:12.5px}
.go{font-size:12px;color:var(--ink35);margin-top:10px}
.row{display:flex;gap:10px;align-items:center}
.row.e>*{flex:1}
.card{border:1px solid var(--line);border-radius:10px;padding:13px 15px;margin-bottom:10px}
.card.act{border-color:var(--ac);background:var(--acs)}
.card.ok{border-color:var(--ok);background:var(--oks)}
.card.mut{opacity:.45}
.dash{border:1px dashed var(--line);border-radius:10px;padding:24px 14px;text-align:center;
  font-size:13px;color:var(--ink60);margin-bottom:14px}
.dash.hot{border-color:var(--ac);background:var(--acs);color:var(--ac)}
.t12{font-size:12px}.t13{font-size:13px}.t14{font-size:14px}
.mu{color:var(--ink60)}.mu2{color:var(--ink35)}
.b5{font-weight:500}.b6{font-weight:600}
.mb0{margin-bottom:0}.mb6{margin-bottom:6px}.mb10{margin-bottom:10px}
.mb16{margin-bottom:16px}.mt10{margin-top:10px}.mt16{margin-top:16px}.mt24{margin-top:24px}
.hr{height:1px;background:var(--line2);margin:16px 0}
.sp{display:flex;justify-content:space-between;align-items:center}
.chip{display:inline-block;font-family:"IBM Plex Mono",monospace;font-size:10px;
  padding:3px 8px;border-radius:20px;background:var(--line2);color:var(--ink60);vertical-align:1px}
.chip.a{background:var(--acs);color:var(--ac)}.chip.o{background:var(--oks);color:var(--ok)}
.chip.w{background:var(--wns);color:var(--wn)}.chip.d{background:var(--bds);color:var(--bd)}
.bar{height:6px;border-radius:3px;background:var(--line2);overflow:hidden;margin:8px 0}
.bar i{display:block;height:100%;background:var(--ac)}
.pick{display:flex;flex-wrap:wrap;gap:7px;margin:0 0 14px}
.pk{border:1px solid var(--line);color:var(--ink60);border-radius:18px;
  padding:6px 13px;font-size:12.5px}
.pk.on{background:var(--ac);color:var(--white);border-color:var(--ac)}
.list{margin:0;padding:0;list-style:none}
.list li{font-size:13px;padding:9px 0;border-bottom:1px solid var(--line2);display:flex;gap:10px}
.list li:last-child{border-bottom:0}
.ck{font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--ok);flex:0 0 14px}
.ck.q{color:var(--wn)}.ck.n{color:var(--ink35)}
.ck.x{color:var(--bd)}
.card.bd{border-color:var(--bd);background:var(--bds)}
.err{font-size:12px;color:var(--bd);margin:-8px 0 12px}
.sep{display:flex;align-items:center;gap:10px;margin:14px 0;font-family:"IBM Plex Mono",monospace;
  font-size:10.5px;color:var(--ink35)}
.sep:before,.sep:after{content:"";flex:1;border-top:1px solid var(--line2)}
.st{font-size:12px;letter-spacing:1.5px}
.st.on{color:var(--wn)}.st.off{color:var(--line)}
.tag{font-family:"IBM Plex Mono",monospace;font-size:9.5px;letter-spacing:.09em;
  text-transform:uppercase;color:var(--ink35);margin-bottom:9px;display:block}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.steps{display:flex;gap:8px;align-items:center;font-family:"IBM Plex Mono",monospace;
  font-size:11px;color:var(--ink35);margin-bottom:20px}
.steps b{color:var(--ink)}

.popwrap{position:relative;flex:1;display:flex;flex-direction:column}
.dim{opacity:.28;flex:1;display:flex;flex-direction:column;pointer-events:none}
.pop{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:410px;
  background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden;
  box-shadow:0 14px 44px rgba(20,23,28,.20)}
.pop .chrome{padding:7px 12px}
.pop .url{font-size:10.5px}
.popb{padding:26px 30px 22px}
.popsvc{font-size:12.5px;color:var(--ink60);margin:0 0 18px}
.acc{display:flex;gap:13px;align-items:center;padding:12px 10px;border-bottom:1px solid var(--line2);border-radius:6px}
.acc.hov{background:var(--soft);box-shadow:0 0 0 1px var(--line)}
.acc .pav{width:32px;height:32px;border-radius:50%;flex:0 0 32px;display:flex;align-items:center;
  justify-content:center;font-size:13px;background:var(--ink);color:#fff}
.acc .pav.o{background:var(--line2);color:var(--ink60)}
.acc .nm{font-size:13.5px;font-weight:500;line-height:1.35}
.acc .em{font-size:12px;color:var(--ink60)}
.popfoot{font-size:11.5px;color:var(--ink35);line-height:1.6;margin:18px 0 0}
.desc{min-height:112px;font-size:13px;line-height:1.75;margin-bottom:12px}
.guide{list-style:none;margin:0 0 12px;padding:0}
.guide li{font-size:12.5px;color:var(--ink35);padding:2px 0 2px 20px;position:relative}
.guide li:before{content:"○";position:absolute;left:0;font-family:"IBM Plex Mono",monospace;font-size:11px}
.guide li.y{color:var(--ink60)}
.guide li.y:before{content:"✓";color:var(--ok)}
.guide.tip li{color:var(--ink60)}
.guide.tip li:before{content:"·";font-size:14px;line-height:1.3}
.nope{border:1px solid var(--wns);background:var(--wns);color:var(--wn);border-radius:9px;padding:9px 13px;font-size:12.5px;margin-top:8px}
.prev{background:var(--soft);border:1px solid var(--line2);border-radius:9px;padding:11px 13px}
.bar2{display:flex;align-items:center;gap:16px;margin-top:18px;flex-wrap:wrap}
.sid{font-size:12px;background:var(--ink);color:var(--white);padding:4px 9px;border-radius:5px}
.sname{flex:1;min-width:200px;font-size:16px;font-weight:500;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.sname .ch{margin:0;font-size:10.5px}
.bar2 .nav-b{padding:9px 16px}
.below{display:grid;grid-template-columns:1fr 280px;gap:44px;margin-top:28px}
@media(max-width:780px){.below{grid-template-columns:1fr;gap:20px}}
.ch{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--ac);margin:0 0 10px}
.narr h2{font-size:25px;font-weight:600;margin:0 0 14px;line-height:1.25;letter-spacing:-.015em}
.narr p{font-size:15.5px;margin:0 0 13px;color:var(--ink60);max-width:58ch}
.narr p b{color:var(--ink);font-weight:500}
.ctrl{display:flex;flex-direction:column;gap:10px}
.nav-b{border:1px solid var(--line);background:var(--white);border-radius:8px;
  padding:11px 18px;font-size:14px;font-weight:500;cursor:pointer;font-family:inherit;color:var(--ink)}
.nav-b:hover:not(:disabled){border-color:var(--ink35)}
.nav-b:disabled{opacity:.35;cursor:default}
.nav-b.pri{background:var(--ink);color:var(--white);border-color:var(--ink)}
.count{font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--ink35);text-align:center}
.track{display:flex;gap:3px;margin-top:26px;flex-wrap:wrap}
.tick{height:4px;flex:1;min-width:6px;border-radius:2px;background:var(--line);cursor:pointer}
.tick.on{background:var(--ink)}
.tick.seen{background:var(--ink35)}
.hint{font-size:12px;color:var(--ink35);margin-top:12px}
</style>
</head>
<body>
<div class="stage">
  <p class="kicker">อ่านยัง? · wireframe · เว็บบนคอม · 38 หน้าจอ</p>
  <div class="win">
    <div class="chrome">
      <div class="dots"><i></i><i></i><i></i></div>
      <div class="url" id="url">anyang.app</div>
      <span class="clock" id="clock">20:14</span>

    <div class="vp" id="vp"></div>
  </div>
  <div class="bar2">
    <span class="sid mono" id="sid"></span>

</div>

title:"ปาลเจออ่านยังตอนสี่ทุ่ม",
story:`<p>ปาลอยู่ ม.5 อีก 5 วันสอบเรื่องแยกตัวประกอบ อ่านชีทเองมาสองวันแล้วรู้สึกว่าอ่านไปก็ไม่รู้ว่าตัวเองเข้าใจจริงหรือเปล่า</p>

const vp=document.getElementById('vp'),chEl=document.getElementById('ch'),
titleEl=document.getElementById('title'),sidEl=document.getElementById('sid'),
countEl=document.getElementById('count'),clockEl=document.getElementById('clock'),
urlEl=document.getElementById('url'),trackEl=document.getElementById('track'),
prevBtn=document.getElementById('prev'),nextBtn=document.getElementById('next');

let i=0,maxSeen=0;
steps.forEach((s,n)=>{const t=document.createElement('div');t.className='tick';
  t.title='S'+String(n+1).padStart(2,'0')+' · '+LABELS[n];t.addEventListener('click',()=>go(n));trackEl.appendChild(t);});
const ticks=Array.from(trackEl.children);

function go(n){
  i=Math.max(0,Math.min(steps.length-1,n));
  maxSeen=Math.max(maxSeen,i);
  const s=steps[i];
  vp.innerHTML=s.screen;
  vp.classList.remove('fade');void vp.offsetWidth;vp.classList.add('fade');
  chEl.textContent=s.ch;titleEl.textContent=LABELS[i];sidEl.textContent='S'+String(i+1).padStart(2,'0');
  clockEl.textContent=s.clock;urlEl.textContent=s.url;
  countEl.textContent=(i+1)+' / '+steps.length;
  prevBtn.disabled=i===0;
  nextBtn.textContent=i===steps.length-1?'หน้าสุดท้าย':'ถัดไป ›';
  nextBtn.disabled=i===steps.length-1;
  ticks.forEach((t,n)=>{t.className='tick'+(n===i?' on':(n<=maxSeen?' seen':''));});
}
prevBtn.addEventListener('click',()=>go(i-1));
nextBtn.addEventListener('click',()=>go(i+1));
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'||e.key===' '){e.preventDefault();go(i+1);}
  if(e.key==='ArrowLeft'){e.preventDefault();go(i-1);}
});
go(0);
</script>
