# Non-secret env of Cloud Run api-staging (gcloud run deploy --env-vars-file).
# A YAML file instead of --set-env-vars: CORS_ALLOW_ORIGINS contains "," and the regex contains
# "^" and "$", which would need a custom delimiter plus shell escaping. Secrets go in Secret Manager.
APP_ENV: staging
# Every endpoint outside the allowlist needs a Supabase JWT (specs/features/platform/api-auth.md).
# Live AI is only safe with this on: the URL is public (--allow-unauthenticated).
AUTH_REQUIRED: "true"
# anyang-staging. The anon (publishable) key is not a secret: the web ships it to every browser.
SUPABASE_URL: https://sfapuygntxuelsxsgkay.supabase.co
SUPABASE_ANON_KEY: sb_publishable_NAPYzI5_d-fwgim-4Kt5Xg_Q3h4koeH
# Gemini on Vertex AI with the runtime SA api-runtime (ADC, no key file · specs/features/ai/gemini-vertex.md).
# SUPABASE_SERVICE_ROLE_KEY comes from Secret Manager (--set-secrets), never from this file.
AI_PROVIDER: live
GOOGLE_CLOUD_PROJECT: anyang-513006
GOOGLE_CLOUD_LOCATION: global
CORS_ALLOW_ORIGINS: https://anyang-amber.vercel.app,http://localhost:3000
CORS_ALLOW_ORIGIN_REGEX: '^https://anyang-[a-z0-9]+-anyang4\.vercel\.app$'
